# Deploy from this folder: see README.md for the four commands.
name = "dawnwalker-builds"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"                       # src/index.js reads env.DB — not the name
                                     # `wrangler d1 create` suggests
database_name = "dawnwalker-builds"
database_id = "433fb5ec-7e3b-4d2d-b147-9bba42506037"

[vars]
# Origins allowed to publish and vote. Reading is public regardless. Add
# http://localhost:8000 while working on the planner locally.
ALLOWED_ORIGINS = "https://mlmariss.github.io"

# Secrets are NOT set here — they would end up in git. Set them with
# `wrangler secret put NAME`:
#   VOTE_SALT         any long random string; it salts the voter fingerprint
#   ADMIN_TOKEN       any long random string; hides and unhides rows
#   TURNSTILE_SECRET  optional; setting it turns the human check on
