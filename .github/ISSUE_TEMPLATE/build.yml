# The community build list is these issues. The planner links here with every
# field already filled in, so "publish" is one click and then Submit; a
# scheduled workflow bakes every open issue carrying the `build` label into
# data/builds.json, and 👍 reactions on the issue are the upvotes.
#
# Moderation is closing the issue: a closed issue leaves the list on the next
# bake. The field ids below are also the query-string parameters the planner
# prefills, so renaming one breaks the Publish button in assets/app.js.
name: Share a build
description: Publish a skill tree build to the planner's community list
title: "[Build] "
labels: ["build"]
body:
  - type: markdown
    attributes:
      value: |
        Submitting adds your build to the planner's **Community builds** list,
        usually within half an hour. Other players upvote it by reacting 👍 to
        this issue.

        The planner fills all of this in for you — press **Submit new issue**.

  - type: input
    id: build-name
    attributes:
      label: Build name
      description: What this build is for, in a few words.
      placeholder: Sun-proof Blade Dancer
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author
      description: The name to credit. Leave blank to publish anonymously.
      placeholder: Anonymous

  - type: textarea
    id: code
    attributes:
      label: Build code
      description: Do not edit this — it is what the planner loads.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: How the build plays, when it comes online, what it gives up.
