<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Blood of Dawnwalker — Skill Tree Planner</title>
<meta name="description" content="Interactive skill tree planner for The Blood of Dawnwalker: Witchcraft, Swordmastery and Vampirism, with prerequisites, corruption gates, manual tracking and a live build summary.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">
      <b>The Blood of Dawnwalker</b>
      <i>Skill Tree Planner</i>
    </span>
  </div>

  <div class="meters">
    <div class="meter" title="Skill points spent across all three trees">
      <span class="meter-ico ico-sp" aria-hidden="true"></span>
      <span class="meter-val" id="m-sp">0</span>
      <span class="meter-lbl">Skill points</span>
    </div>
    <div class="meter" title="Time segments spent training">
      <span class="meter-ico ico-ts" aria-hidden="true"></span>
      <span class="meter-val" id="m-ts">0</span>
      <span class="meter-lbl">Time segments</span>
    </div>
    <div class="meter" title="Manuals this build needs you to find">
      <span class="meter-ico ico-bk" aria-hidden="true"></span>
      <span class="meter-val" id="m-bk">0</span>
      <span class="meter-lbl">Manuals</span>
    </div>
  </div>

  <div class="controls">
    <label class="ctl" title="Vampiric perk levels unlock at Corruption levels">
      <span class="ctl-lbl">Corruption</span>
      <input type="range" id="corruption" min="0" max="15" step="1" value="15">
      <output id="corruption-out">15</output>
    </label>
    <label class="ctl ctl-check" title="Some levels can only be learned from a Manual found in the world">
      <input type="checkbox" id="manuals" checked>
      <span>Manuals found</span>
    </label>
    <label class="ctl ctl-check" title="Experimental: mark other perks that act on the same systems">
      <input type="checkbox" id="synergy" checked>
      <span>Synergies</span>
    </label>
    <button class="btn" id="share" type="button">Copy link</button>
    <button class="btn btn-ghost" id="reset" type="button">Reset</button>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Skill trees"></nav>

<main class="stage">
  <section class="board">
    <div class="boardscroll" id="boardscroll">
      <div class="tree" id="tree">
        <svg class="links" id="links" aria-hidden="true"></svg>
        <div class="nodes" id="nodes"></div>
      </div>
    </div>

    <details class="drawer" id="ultdrawer">
      <summary>
        <span class="drawer-title">Ultimate Perks</span>
        <span class="drawer-note">only one per skill tree, permanently</span>
        <span class="ult-gate" id="ult-gate"></span>
      </summary>
      <div class="ults" id="ults"></div>
    </details>

    <p class="hint">Click a node to learn its next level · Right-click to refund · Padlocked nodes are story unlocks</p>
  </section>

  <aside class="side">
    <div class="panel" id="panel"></div>

    <details class="drawer" id="ovdrawer" open>
      <summary>
        <span class="drawer-title">Build overview</span>
        <span class="drawer-note" id="ov-note"></span>
      </summary>
      <div class="ovbody" id="ov-body"></div>
    </details>
  </aside>
</main>

<div class="toast" id="toast" role="status"></div>

<script src="assets/icons.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
